<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-label="D4RT training and inference data flow">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <marker id="softArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #111827; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 12; }
      .encoder { fill: #ecfeff; stroke: #0891b2; }
      .decoder { fill: #fff7ed; stroke: #ea580c; }
      .query { fill: #fdf2f8; stroke: #db2777; }
      .loss { fill: #f0fdf4; stroke: #16a34a; }
      .task { fill: #f8fafc; stroke: #64748b; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 16px; fill: #374151; }
      .tiny { font-size: 14px; fill: #4b5563; }
      .arrow { stroke: #1f2937; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#softArrow); stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect x="20" y="20" width="1460" height="720" rx="22" fill="#fbfdff" stroke="#e5e7eb"/>
  <text x="60" y="66" class="title">D4RT data flow: encode once, query any point in space and time</text>
  <text x="60" y="94" class="subtitle">The same decoder interface supports tracking, point clouds, depth, extrinsics, and intrinsics by changing query fields.</text>

  <rect x="70" y="150" width="210" height="110" class="box"/>
  <text x="95" y="186" class="label">Input video V</text>
  <text x="95" y="216" class="small">T x H x W x 3</text>
  <text x="95" y="242" class="tiny">resize to fixed square</text>

  <rect x="360" y="136" width="250" height="138" class="box encoder"/>
  <text x="390" y="174" class="label">Self-attention encoder</text>
  <text x="390" y="204" class="small">ViT-g, 40 layers</text>
  <text x="390" y="230" class="tiny">spatio-temporal patch 2 x 16 x 16</text>
  <text x="390" y="254" class="tiny">local frame-wise + global attention</text>

  <rect x="700" y="150" width="250" height="110" class="box encoder"/>
  <text x="724" y="186" class="label">Global Scene Rep.</text>
  <text x="724" y="216" class="small">G = Enc(V)</text>
  <text x="724" y="242" class="tiny">shape: N x C, C not specified</text>

  <rect x="1025" y="136" width="330" height="138" class="box decoder"/>
  <text x="1054" y="174" class="label">Pointwise decoder</text>
  <text x="1054" y="204" class="small">8-layer cross-attention</text>
  <text x="1054" y="230" class="tiny">each query independent</text>
  <text x="1054" y="254" class="tiny">decoder params: 144M</text>

  <rect x="700" y="330" width="300" height="138" class="box query"/>
  <text x="728" y="368" class="label">Query token q</text>
  <text x="728" y="398" class="small">(u, v, t_src, t_tgt, t_cam)</text>
  <text x="728" y="424" class="tiny">Fourier 2D coord + time embeddings</text>
  <text x="728" y="448" class="tiny">+ local 9 x 9 RGB source patch</text>

  <rect x="1075" y="356" width="250" height="88" class="box decoder"/>
  <text x="1105" y="392" class="label">Output point P</text>
  <text x="1105" y="422" class="small">P in R^3</text>

  <path class="arrow" d="M280,205 C305,205 330,205 360,205"/>
  <path class="arrow" d="M610,205 C640,205 670,205 700,205"/>
  <path class="arrow" d="M950,205 C980,205 1000,205 1025,205"/>
  <path class="arrow" d="M1000,399 C1030,399 1050,399 1075,399"/>
  <path class="soft" d="M850,330 C890,285 980,260 1030,245"/>
  <text x="860" y="296" class="tiny">cross-attend into fixed G</text>

  <rect x="70" y="535" width="390" height="150" class="box loss"/>
  <text x="98" y="572" class="label">Training supervision</text>
  <text x="98" y="602" class="small">2048 sampled queries per clip</text>
  <text x="98" y="628" class="tiny">48 frames, 256 x 256, AdamW, 500k steps</text>
  <text x="98" y="652" class="tiny">losses: 3D L1, 2D, visibility, normals,</text>
  <text x="98" y="676" class="tiny">motion displacement, confidence penalty</text>

  <rect x="540" y="535" width="410" height="150" class="box task"/>
  <text x="568" y="572" class="label">Inference by changing q</text>
  <text x="568" y="602" class="small">track: fix source point, vary target time</text>
  <text x="568" y="628" class="tiny">depth: set t_src = t_tgt = t_cam, keep z</text>
  <text x="568" y="652" class="tiny">point cloud: query all pixels in one ref camera</text>
  <text x="568" y="676" class="tiny">camera: coarse grid + Umeyama / pinhole median</text>

  <rect x="1030" y="535" width="365" height="150" class="box task"/>
  <text x="1058" y="572" class="label">Dense all-pixel tracking</text>
  <text x="1058" y="602" class="small">avoid naive O(T^2 H W) queries</text>
  <text x="1058" y="628" class="tiny">occupancy grid marks visible visited pixels</text>
  <text x="1058" y="652" class="tiny">new tracks start only from unvisited pixels</text>
  <text x="1058" y="676" class="tiny">reported adaptive speedup: 5-15x</text>

  <path class="soft" d="M850,468 C730,495 500,530 430,535"/>
  <path class="soft" d="M1200,444 C1160,490 1050,520 920,535"/>
  <path class="soft" d="M1200,444 C1210,490 1212,520 1212,535"/>
</svg>
