<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">ELF training and inference data flow</title>
  <desc id="desc">A diagram showing token encoding, continuous embedding flow matching, shared denoise and decode branches, and final token decoding in ELF.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2f3b4f"/>
    </marker>
    <marker id="softArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a5a22"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b1220" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #121826; }
      .subtitle { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5565; }
      .section { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #152033; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475166; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b667a; }
      .eq { font: 600 15px "SFMono-Regular", Consolas, monospace; fill: #253047; }
      .panel { fill: #f7f8fb; stroke: #d8deea; stroke-width: 1.4; rx: 18; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .blue { fill: #e7f0ff; stroke: #7ba5e8; }
      .green { fill: #e7f6ee; stroke: #76b98d; }
      .amber { fill: #fff4dc; stroke: #d6a349; }
      .rose { fill: #fdecef; stroke: #d48696; }
      .purple { fill: #f0ecff; stroke: #9b82d8; }
      .darkLine { stroke: #2f3b4f; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .softLine { stroke: #7a5a22; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#softArrow); }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="54" y="58" class="title">ELF: continuous embedding flow, discrete tokens only at the end</text>
  <text x="54" y="88" class="subtitle">Clean tokens are encoded once; training alternates denoising and decoding branches through one shared Transformer.</text>

  <rect x="44" y="118" width="612" height="575" class="panel"/>
  <rect x="744" y="118" width="612" height="575" class="panel"/>
  <text x="72" y="156" class="section">Training: two branches, one shared network</text>
  <text x="772" y="156" class="section">Inference: stay continuous until final decode</text>

  <rect x="78" y="190" width="142" height="78" class="box blue"/>
  <text x="101" y="221" class="label">tokens s</text>
  <text x="96" y="246" class="small">T5 token ids</text>

  <rect x="278" y="190" width="158" height="78" class="box blue"/>
  <text x="306" y="221" class="label">T5 encoder</text>
  <text x="300" y="246" class="small">frozen, contextual</text>

  <rect x="494" y="190" width="128" height="78" class="box green"/>
  <text x="535" y="221" class="label">x</text>
  <text x="515" y="246" class="small">clean embeddings</text>

  <path d="M220 229 L278 229" class="darkLine"/>
  <path d="M436 229 L494 229" class="darkLine"/>

  <rect x="82" y="334" width="184" height="108" class="box amber"/>
  <text x="118" y="365" class="label">denoise branch</text>
  <text x="104" y="391" class="small">sample t, epsilon</text>
  <text x="99" y="417" class="eq">z_t = t x + (1-t)e</text>

  <rect x="338" y="334" width="184" height="108" class="box purple"/>
  <text x="374" y="365" class="label">ELF denoise</text>
  <text x="362" y="391" class="small">x-prediction mode</text>
  <text x="365" y="417" class="eq">v = (x_hat-z_t)/(1-t)</text>

  <rect x="82" y="512" width="184" height="106" class="box rose"/>
  <text x="121" y="543" class="label">decode branch</text>
  <text x="103" y="569" class="small">corrupt clean x at t=1</text>
  <text x="104" y="595" class="small">force token readout</text>

  <rect x="338" y="512" width="184" height="106" class="box purple"/>
  <text x="376" y="543" class="label">ELF decode</text>
  <text x="365" y="569" class="small">same weights, mode token</text>
  <text x="365" y="595" class="small">unembedding W -> logits</text>

  <rect x="560" y="408" width="72" height="142" class="box green"/>
  <text x="576" y="465" class="label">loss</text>
  <text x="579" y="492" class="small">MSE</text>
  <text x="580" y="517" class="small">CE</text>

  <path d="M558 268 C558 302, 174 294, 174 334" class="softLine"/>
  <path d="M266 388 L338 388" class="darkLine"/>
  <path d="M522 388 C552 388, 560 420, 560 448" class="darkLine"/>
  <path d="M558 268 C558 470, 174 468, 174 512" class="softLine"/>
  <path d="M266 565 L338 565" class="darkLine"/>
  <path d="M522 565 C546 565, 560 540, 560 510" class="darkLine"/>

  <text x="89" y="648" class="tiny">Default ELF-B details: T5-small encoder dim 512, bottleneck 128, Transformer hidden 768, 12 layers, 12 heads.</text>
  <text x="89" y="671" class="tiny">Training mixes denoise and decode samples; self-conditioning and CFG are represented by conditioning tokens.</text>

  <rect x="786" y="198" width="150" height="82" class="box amber"/>
  <text x="827" y="230" class="label">z0</text>
  <text x="811" y="256" class="small">Gaussian noise</text>

  <rect x="1000" y="198" width="206" height="82" class="box purple"/>
  <text x="1047" y="230" class="label">ODE / SDE steps</text>
  <text x="1024" y="256" class="small">predict x, update z_t</text>

  <rect x="1026" y="362" width="154" height="82" class="box green"/>
  <text x="1087" y="394" class="label">z1</text>
  <text x="1054" y="420" class="small">near clean embedding</text>

  <rect x="824" y="362" width="154" height="82" class="box rose"/>
  <text x="858" y="394" class="label">decode mode</text>
  <text x="845" y="420" class="small">shared network + W</text>

  <rect x="824" y="526" width="154" height="82" class="box blue"/>
  <text x="849" y="558" class="label">final tokens</text>
  <text x="848" y="584" class="small">argmax / text output</text>

  <path d="M936 239 L1000 239" class="darkLine"/>
  <path d="M1103 280 L1103 362" class="darkLine"/>
  <path d="M1026 403 L978 403" class="darkLine"/>
  <path d="M901 444 L901 526" class="darkLine"/>

  <path d="M1206 239 C1270 285, 1270 355, 1180 394" class="softLine"/>
  <text x="1217" y="317" class="tiny">repeat N steps</text>
  <text x="1217" y="338" class="tiny">32 SDE on OWT</text>
  <text x="1217" y="359" class="tiny">64 ODE on conditional tasks</text>

  <rect x="986" y="526" width="262" height="82" class="box blue"/>
  <text x="1016" y="558" class="label">conditional generation</text>
  <text x="1014" y="584" class="small">keep source prefix clean; generate target suffix</text>

  <path d="M978 567 L986 567" class="darkLine"/>

  <text x="785" y="648" class="tiny">Key distinction from many DLMs: no token-by-token denoising during the trajectory; discretization happens once at t=1.</text>
  <text x="785" y="671" class="tiny">Metric caveat: OpenWebText quality is reported with GPT-2-Large generation perplexity plus unigram entropy.</text>
</svg>
