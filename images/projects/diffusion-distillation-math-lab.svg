<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Diffusion distillation trajectory map</title>
  <desc id="desc">A mathematical trajectory map showing a noisy diffusion path compressed into one-step and few-step student paths.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#eee7d6"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#171717" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#171717" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#f2f1ea"/>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <rect x="72" y="76" width="1056" height="608" rx="18" fill="url(#paper)" stroke="#a99f88" filter="url(#shadow)"/>
  <g transform="translate(130 132)">
    <text x="0" y="0" fill="#07504c" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="28" font-weight="800">DIFFUSION DISTILLATION</text>
    <text x="0" y="58" fill="#171717" font-family="Georgia, Times New Roman, serif" font-size="70" font-weight="700">Math Lab</text>
    <text x="2" y="106" fill="#4f5650" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="600">LCM · TCD · ADD · LADD · DMD · DMD2 · MeanFlow</text>
  </g>
  <g transform="translate(130 252)">
    <path d="M26 348 C210 92 396 438 582 206 S808 92 936 188" fill="none" stroke="#171717" stroke-opacity=".28" stroke-width="7" stroke-dasharray="18 18"/>
    <path d="M26 348 L244 182 L448 224 L666 116 L936 188" fill="none" stroke="#245c8d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 348 C276 348 576 302 936 188" fill="none" stroke="#0a7068" stroke-width="7" stroke-linecap="round" stroke-opacity=".82"/>
    <path d="M26 348 L936 188" fill="none" stroke="#3f7b42" stroke-width="8" stroke-linecap="round"/>
    <g fill="#fffdf6" stroke="#171717" stroke-width="7">
      <circle cx="26" cy="348" r="20"/>
      <circle cx="936" cy="188" r="20"/>
    </g>
    <g fill="#fffdf6" stroke="#245c8d" stroke-width="6">
      <circle cx="244" cy="182" r="15"/>
      <circle cx="448" cy="224" r="15"/>
      <circle cx="666" cy="116" r="15"/>
    </g>
    <g fill="#b44735" opacity=".82">
      <circle cx="620" cy="348" r="8"/>
      <circle cx="676" cy="296" r="8"/>
      <circle cx="726" cy="334" r="8"/>
      <circle cx="782" cy="260" r="8"/>
      <circle cx="826" cy="304" r="8"/>
    </g>
    <g stroke="#b44735" stroke-width="4" stroke-linecap="round" opacity=".62">
      <path d="M620 348 690 294"/>
      <path d="M676 296 748 254"/>
      <path d="M726 334 810 282"/>
      <path d="M782 260 874 222"/>
      <path d="M826 304 920 222"/>
    </g>
    <text x="0" y="420" fill="#171717" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="800">noise</text>
    <text x="868" y="156" fill="#171717" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="25" font-weight="800">data</text>
    <text x="274" y="104" fill="#245c8d" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">few-step solver</text>
    <text x="478" y="278" fill="#0a7068" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">consistency map</text>
    <text x="682" y="388" fill="#b44735" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">score gap</text>
  </g>
  <g transform="translate(130 632)" font-family="SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">
    <text x="0" y="0" fill="#07504c">teacher: 20-100 NFE</text>
    <text x="340" y="0" fill="#b44735">student: 1-4 NFE</text>
    <text x="670" y="0" fill="#3f7b42">target: shorter trajectory</text>
  </g>
</svg>
