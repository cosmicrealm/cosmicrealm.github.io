  teaser: /images/projects/generation-acceleration.svg
  teaser_alt: 覆盖采样、attention、cache、量化、serving 与训练的生成模型加速技术图
  highlight: 采样、attention kernels、KV cache、量化、serving 与分布式训练
  summary: >-
    生成模型加速要先定位瓶颈：compute、memory bandwidth、串行采样深度、调度、
    cache 和通信往往限制在不同层面。这里用公式、伪代码和交互实验串起
