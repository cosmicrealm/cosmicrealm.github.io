- name: 生成模型蒸馏技术介绍
  category: 生成式蒸馏
  status: teacher trajectory 到 fast student sampler
  featured: true
  date: 2026-06-27
  display_date: 06/2026
  url: /foundations/generation-distillation/
  teaser: /images/projects/diffusion-distillation-math-lab.svg
  teaser_alt: 从 teacher trajectory 到 fast student sampler 的生成模型蒸馏技术图
  highlight: 从经典 KD 到 trajectory、consistency、DMD2、LADD 与 Self-Forcing
  summary: >-
    生成式蒸馏不是经典 KD 的 logits 模仿。核心问题是怎样把 teacher 的生成轨迹、
    score/velocity 信息和少步采样行为压进 fast student sampler。这里用训练和推理伪代码、
    交互机制实验串联 trajectory distillation、guided distillation、consistency、
    DMD/DMD2、ADD/LADD、rectified-flow shortcuts、Self Forcing 和 Self-Forcing++。
  tags:
    - Diffusion
    - 蒸馏
    - 快速生成
