- name: 视频生成技术
  category: 生成式视频
  status: Video VAE 到 Wan / LTX
  featured: true
  date: 2026-07-01
  display_date: 07/2026
  url: /foundations/video-generation/
  teaser: /images/projects/video-generation.svg
  teaser_alt: 从 Video VAE latent tokens 到 Wan 与 LTX 生态分支的视频生成技术图
  highlight: Video VAE、DiT、Flow Matching、Wan、LTX、VACE、IC-LoRA 与音视频生成
  summary: >-
    Video VAE latent tokens 决定视频生成可扩展性：它们把高维像素视频压到可训练的
    时空 latent space，让 DiT 与 Flow Matching 能在更低成本下建模运动、镜头和语义。
    Wan 与 LTX 因此走向两条路线：Wan 更偏向高质量生成、角色动画和统一编辑，LTX 更偏向
    高压缩、蒸馏、多尺度超分、IC-LoRA 和联合音视频生产工作流。
  tags:
    - 视频生成
    - Wan
    - LTX
    - 音视频生成
