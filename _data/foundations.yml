- name: 生成模型蒸馏技术介绍
  category: 生成式蒸馏
  status: 路径压缩到自回归自校正
  featured: true
  date: 2026-06-27
  display_date: 06/2026
  url: /foundations/generation-distillation/
  teaser: /images/projects/diffusion-distillation-math-lab.svg
  teaser_alt: 从 teacher trajectory 到 fast student sampler 的生成模型蒸馏技术图
  highlight: 从 teacher path 压缩到 distribution matching 与 self-rollout correction
  summary: >-
    生成式蒸馏不是经典 KD 的 logits 模仿。核心问题是低 NFE student 到底应该匹配
    teacher path、endpoint、noisy marginal distribution、adversarial feature，
    还是自己推理时会访问的 self-rollout state distribution。这里用公式、伪代码和
    交互机制实验串联 Progressive/Guided Distillation、Consistency/LCM、DMD/DMD2、
    ADD/LADD、Flow shortcuts、Self-Forcing 和 Self-Forcing++。
  tags:
    - Diffusion
    - 蒸馏
    - 快速生成
