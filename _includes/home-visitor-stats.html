<section class="visitor-reach home-section" data-visitor-stats aria-labelledby="visitor-reach-title">
  <div class="visitor-reach__heading">
    <div>
      <p class="visitor-reach__eyebrow">05 / Visitors</p>
      <h2 id="visitor-reach-title">Global Reach</h2>
    </div>
  </div>

  <div class="visitor-reach__body">
    <dl class="visitor-reach__stats" aria-label="Site visitor statistics">
      <div>
        <dd data-visitor-total>—</dd>
        <dt>Total visits</dt>
      </div>
      <div>
        <dd data-visitor-today>—</dd>
        <dt>Visitors today</dt>
      </div>
      <div>
        <dd data-visitor-countries>—</dd>
        <dt>Countries reached</dt>
      </div>
    </dl>

    <div class="visitor-reach__map">
      {% include world-map.svg %}
      <div class="visitor-reach__legend" data-visitor-map-legend aria-label="Map color scale from fewer to more visits">
        <span>Fewer visits</span>
        <span class="visitor-reach__legend-scale" aria-hidden="true"></span>
        <span>More visits</span>
      </div>
    </div>
  </div>

  <div class="visitor-reach__footer">
    <span data-visitor-status aria-live="polite">Loading live statistics</span>
  </div>
  <p class="screen-reader-text" data-visitor-accessible-summary aria-live="polite"></p>
</section>
